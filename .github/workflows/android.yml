name: Android
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      apk_version: ${{ steps.version.outputs.apk_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Read and verify app version
        id: version
        shell: bash
        run: |
          version="$(./gradlew -q :app:printVersion)"
          apk_version="$version"
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            revision="${GITHUB_SHA:0:12}"
            echo "ORG_GRADLE_PROJECT_phosphorDebugRevision=$revision" >> "$GITHUB_ENV"
            apk_version="$version+g$revision"
          fi
          echo "apk_version=$apk_version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match version.properties (v$version)" >&2
            exit 1
          fi
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: phosphor-${{ steps.version.outputs.apk_version }}-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phosphor-reports
          path: |
            app/build/reports/phosphor-artwork.png
            app/build/reports/phosphor-legibility.txt
            app/build/reports/tests/

  publish-debug:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      APK_NAME: phosphor-${{ needs.build.outputs.apk_version }}-debug
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ runner.temp }}/debug-apk
      - name: Prepare release notes on a version increase
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          cp tools/release-changelog.mjs "$RUNNER_TEMP/release-changelog.mjs"
          node "$RUNNER_TEMP/release-changelog.mjs" prepare
      - name: Commit the verified APK and any release notes to main
        id: publish
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          destination="releases/$APK_NAME.apk"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            tip=$(git rev-parse FETCH_HEAD)
            if ! git merge-base --is-ancestor "$GITHUB_SHA" "$tip"; then
              echo "Source commit is no longer on main. Skipping publication."
              exit 0
            fi
            git checkout --detach "$tip"
            if ! git ls-files --error-unmatch -- "$destination" >/dev/null 2>&1; then
              mkdir -p releases
              cp "$RUNNER_TEMP/debug-apk/app-debug.apk" "$destination"
              git add -f -- "$destination"
            fi
            refs=(HEAD:refs/heads/main)
            if [[ -n "${RELEASE_VERSION:-}" ]]; then
              node "$RUNNER_TEMP/release-changelog.mjs" update
              git add -- CHANGELOG.md
              tag="refs/tags/v$RELEASE_VERSION"
              if git show-ref --verify --quiet "$tag"; then
                [[ "$(git rev-parse "$tag^{commit}")" == "$GITHUB_SHA" ]] || {
                  echo "::error::Tag $tag already belongs to a different source commit"; exit 1;
                }
              else
                refs+=("$GITHUB_SHA:$tag")
              fi
            fi
            if ! git diff --cached --quiet; then git commit -m "Publish $APK_NAME"; fi
            if git push --atomic origin "${refs[@]}"; then
              echo "ready=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep "$attempt"
          done
          echo "::error::Could not publish to main. Check branch rules and Actions write access."
          exit 1
      - name: Publish the tagged GitHub Release with its APK
        if: steps.publish.outputs.ready == 'true' && env.RELEASE_VERSION != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="v$RELEASE_VERSION"
          asset="phosphor-$RELEASE_VERSION-debug.apk"
          cp "releases/$APK_NAME.apk" "$RUNNER_TEMP/$asset"
          printf '\nThis CI debug APK may use a different signing key from your installed copy. If Android requires a reinstall, uninstalling clears saved looks and imported photos.\n' >> "$RUNNER_TEMP/release-notes.md"
          if release=$(gh release view "$tag" --json isDraft,assets); then
            if [[ "$(jq -r .isDraft <<< "$release")" == false ]]; then
              jq -e --arg name "$asset" 'any(.assets[]; .name == $name and .state == "uploaded")' <<< "$release"
              exit 0
            fi
          else
            gh release create "$tag" --verify-tag --draft --title "Phosphor $RELEASE_VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$tag" "$RUNNER_TEMP/$asset" --clobber
          id=$(gh release view "$tag" --json databaseId --jq .databaseId)
          gh api --silent --method PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
            -F draft=false -f make_latest=legacy -F "body=@$RUNNER_TEMP/release-notes.md"
