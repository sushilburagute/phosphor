name: Android
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      bump:
        description: Release version increment
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      apk_version: ${{ steps.version.outputs.apk_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && '0' || '1' }}
      - name: Prepare selected release
        if: github.event_name == 'workflow_dispatch'
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Select main to run a release."
            exit 1
          fi
          node tools/release-changelog.mjs "$BUMP"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Read and verify app version
        id: version
        shell: bash
        run: |
          version="$(./gradlew -q :app:printVersion)"
          apk_version="$version"
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            revision="${GITHUB_SHA:0:12}"
            echo "ORG_GRADLE_PROJECT_phosphorDebugRevision=$revision" >> "$GITHUB_ENV"
            apk_version="$version+g$revision"
          fi
          echo "apk_version=$apk_version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match version.properties (v$version)" >&2
            exit 1
          fi
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: phosphor-${{ steps.version.outputs.apk_version }}-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: release-metadata
          path: |
            version.properties
            CHANGELOG.md
            release-notes.md
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phosphor-reports
          overwrite: true
          path: |
            app/build/reports/phosphor-artwork.png
            app/build/reports/phosphor-legibility.txt
            app/build/reports/tests/

  publish-debug:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.build.outputs.apk_version }}
      APK_NAME: phosphor-${{ needs.build.outputs.apk_version }}-debug
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ runner.temp }}/debug-apk
      - uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: ${{ runner.temp }}/release-metadata
      - name: Commit and tag the verified release on main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          destination="releases/$APK_NAME.apk"
          tag="refs/tags/v$RELEASE_VERSION"
          if git show-ref --verify --quiet "$tag"; then
            if [[ "$(git rev-parse "$tag^")" != "$GITHUB_SHA" ||
                  "$(git log -1 --format='%(trailers:key=Release-Run,valueonly)' "$tag")" != "$GITHUB_RUN_ID" ]]; then
              echo "::error::Tag $tag already belongs to another release."
              exit 1
            fi
          else
            cp "$RUNNER_TEMP/release-metadata/"{version.properties,CHANGELOG.md} .
            mkdir -p releases
            cp "$RUNNER_TEMP/debug-apk/app-debug.apk" "$destination"
            git add -- version.properties CHANGELOG.md
            git add -f -- "$destination"
            git commit -m "Release v$RELEASE_VERSION" -m "Release-Run: $GITHUB_RUN_ID"
            git tag "v$RELEASE_VERSION"
            if ! git push --atomic --force-with-lease="refs/heads/main:$GITHUB_SHA" origin HEAD:refs/heads/main "$tag"; then
              echo "::error::Could not publish. If main advanced, start a new run from main."
              exit 1
            fi
          fi
          git show "$tag:$destination" > "$RUNNER_TEMP/$APK_NAME.apk"
      - name: Publish the tagged GitHub Release with its APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="v$RELEASE_VERSION"
          asset="phosphor-$RELEASE_VERSION-debug.apk"
          cp "$RUNNER_TEMP/release-metadata/release-notes.md" "$RUNNER_TEMP/release-notes.md"
          printf '\nThis CI debug APK may use a different signing key from your installed copy. If Android requires a reinstall, uninstalling clears saved looks and imported photos.\n' >> "$RUNNER_TEMP/release-notes.md"
          if release=$(gh release view "$tag" --json isDraft,assets); then
            if [[ "$(jq -r .isDraft <<< "$release")" == false ]]; then
              jq -e --arg name "$asset" 'any(.assets[]; .name == $name and .state == "uploaded")' <<< "$release"
              exit 0
            fi
          else
            gh release create "$tag" --verify-tag --draft --title "Phosphor $RELEASE_VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$tag" "$RUNNER_TEMP/$asset" --clobber
          id=$(gh release view "$tag" --json databaseId --jq .databaseId)
          gh api --silent --method PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
            -F draft=false -f make_latest=legacy -F "body=@$RUNNER_TEMP/release-notes.md"
